    <div class="swiper-buttons-container">
        <swiper #swiper 
        [config]="config" 
        (slideChange)="onSlideChange($event)" 
        class="swiper-container">
            <ng-container *ngFor="let question of questions; let index = index">
                <ng-template swiperSlide *ngIf="question?.mainTag ? isMainPositive(question.mainTag) : true">
                    <div class="question-container" #scrollContainer (scroll)="checkScroll(index)">
                        <h3><span *ngIf="question.tag">{{question.tag}}.</span> {{question.label[lang]}}</h3>
                        <ng-template 
                                        [ngTemplateOutlet]="getType(question.type)" 
                                        [ngTemplateOutletContext]="{index: index, options: question?.options}"></ng-template>

                        <div class="scroll-anim" *ngIf="hasScroll[index]" (click)="scrollBottom(index)">
                            <div class="bubble-container">
                                <div class="bubble"></div>
                            </div>
                            <div class="chevron-container">
                                <ion-icon name="chevron-down-outline"></ion-icon>
                                <ion-icon name="chevron-down-outline"></ion-icon>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </ng-container>
        </swiper>

        <ion-toolbar class="nav-buttons">
            <ion-buttons slot="start">
                <ion-button (click)="saveSurvey()" [disabled]="!isCompleted" color="primary" shape="round" fill="solid" class="send" mode="md">
                    Enviar
                </ion-button>
            </ion-buttons>
            <ion-buttons slot="end">
                <ion-button (click)="slidePrevious()" [disabled]="isBegining" color="primary" shape="round" fill="solid" class="up" mode="md">
                    <ion-icon name="chevron-up-outline"></ion-icon>
                </ion-button>
                <ion-button (click)="slideNext()" [disabled]="!canContinue" color="primary" shape="round" fill="solid" class="down" mode="md">
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </ion-button>
            </ion-buttons>
        </ion-toolbar>

<ng-template #select let-index="index" let-options="options">
    <ion-radio-group mode="md" [ngModel]="questions[index].value" (ngModelChange)="inputChange(index, $event)">
        <ion-item *ngFor="let option of options | keyvalue: noSort" lines="none" detail="false" 
        [disabled]="loading" [class.item-selected]="questions[index].value == option.key">
            <ion-label>{{ $any(option.value)[lang] }}</ion-label>
            <ion-radio slot="start" [value]="option.key"></ion-radio>
        </ion-item>
    </ion-radio-group>
</ng-template>

<ng-template #numberSelector let-index="index">
    <ion-range [min]="divideOption(questions[index].options, 0)" [max]="divideOption(questions[index].options, 1)" step="1" [pin]="true" [snaps]="true" [ticks]="false" 
    [(ngModel)]="questions[index].value" (ionKnobMoveEnd)="inputChange(index)" mode="ios" class="mb-2">
        <ion-label slot="start" mode="ios">{{ divideOption(questions[index].options, 0) }}</ion-label>
        <ion-label slot="end" mode="ios">{{ divideOption(questions[index].options, 1) }}</ion-label>
    </ion-range>
</ng-template>

<ng-template #txtSelector let-index="index">
    <!-- INPUT TXT -->
    <ion-textarea
        placeholder="Escriu aquí la teva resposta"
        [autoGrow]="true"
        [(ngModel)]="questions[index].value">
    </ion-textarea>
</ng-template>

<ng-template #painSelector let-index="index">
    <ion-range [min]="0" [max]="10" step="1" [pin]="true" [snaps]="true" [ticks]="false" 
    [(ngModel)]="questions[index].value" (ionKnobMoveEnd)="inputChange(index)" mode="ios" class="mb-2">
        <ion-label slot="start" mode="ios">Poc dolor</ion-label>
        <ion-label slot="end" mode="ios">Molt dolor</ion-label>
    </ion-range>
</ng-template>
