<ion-header>
    <ion-toolbar>
        <ion-title slot="start">{{title}}</ion-title>
        <ion-buttons slot="end">
            <ion-button color="medium" (click)="cancel()">
                <ion-icon name="close-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
<ion-content>
    <div class="swiper-buttons-container">
        <swiper #swiper 
        [config]="config" 
        (slideChange)="onSlideChange($event)" 
        class="swiper-container">
            <ng-container *ngFor="let question of questions; let index = index">
                <ng-template swiperSlide *ngIf="question?.mainTag ? isMainPositive(question.mainTag) : true">
                    <div class="question-container" #scrollContainer (scroll)="checkScroll(index)">
                        <h3>{{question.tag}}. {{question.label[lang]}}</h3>
                        <ng-template 
                                        [ngTemplateOutlet]="getType(question.type)" 
                                        [ngTemplateOutletContext]="{index: index}"></ng-template>

                        <div class="scroll-anim" *ngIf="hasScroll[index]" (click)="scrollBottom(index)">
                            <div class="bubble-container">
                                <div class="bubble"></div>
                            </div>
                            <div class="chevron-container">
                                <ion-icon name="chevron-down-outline"></ion-icon>
                                <ion-icon name="chevron-down-outline"></ion-icon>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </ng-container>
        </swiper>

        <ion-toolbar class="nav-buttons">
            <ion-buttons slot="start">
                <ion-button (click)="saveSurvey()" [disabled]="!isCompleted" color="primary" shape="round" fill="solid" class="send" mode="md">
                    Enviar
                </ion-button>
            </ion-buttons>
            <ion-buttons slot="end">
                <ion-button (click)="slidePrevious()" [disabled]="isBegining" color="primary" shape="round" fill="solid" class="up" mode="md">
                    <ion-icon name="chevron-up-outline"></ion-icon>
                </ion-button>
                <ion-button (click)="slideNext()" [disabled]="!canContinue" color="primary" shape="round" fill="solid" class="down" mode="md">
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </ion-button>
            </ion-buttons>
        </ion-toolbar>
        <!-- <ion-buttons class="nav-buttons">
            <ion-button (click)="slidePrevious()" [disabled]="isBegining" color="primary" shape="round" fill="solid">
                <ion-icon name="chevron-up-outline"></ion-icon>
            </ion-button>
            <ion-button (click)="slideNext()" *ngIf="!isEnd; else send" color="primary" shape="round" fill="solid">
                <ion-icon name="chevron-down-outline"></ion-icon>
            </ion-button>
            <ng-template #send>
                <ion-button (click)="saveSurvey()" color="primary" shape="round" fill="solid" class="send">
                    Enviar
                </ion-button>
            </ng-template>
        </ion-buttons> -->
    </div>
</ion-content>

<ng-template #frequencySelector let-index="index">
    <ion-radio-group mode="md" [ngModel]="questions[index].value" (ngModelChange)="inputChange(index, $event)">
        <ion-item lines="none" detail="false" [disabled]="loading" [class.item-selected]="questions[index].value == 'nunca'">
            <ion-label>Nunca</ion-label>
            <ion-radio slot="start" value="nunca"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading" [class.item-selected]="questions[index].value == 'rara vez'">
            <ion-label>Rara vez</ion-label>
            <ion-radio slot="start" value="rara vez"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading" [class.item-selected]="questions[index].value == 'a veces'">
            <ion-label>A veces</ion-label>
            <ion-radio slot="start" value="a veces"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading" [class.item-selected]="questions[index].value == 'a menudo'">
            <ion-label>A menudo</ion-label>
            <ion-radio slot="start" value="a menudo"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading" [class.item-selected]="questions[index].value == 'siempre'">
            <ion-label>Siempre</ion-label>
            <ion-radio slot="start" value="siempre"></ion-radio>
        </ion-item>
    </ion-radio-group>
</ng-template>

<ng-template #numberSelector let-index="index">
    <ion-range min="1" max="10" step="1" [pin]="true" [snaps]="true" [ticks]="false" 
    [(ngModel)]="questions[index].value" (ionKnobMoveEnd)="inputChange(index)" mode="ios" class="mb-2">
        <ion-label slot="start" mode="ios">1</ion-label>
        <ion-label slot="end" mode="ios">10</ion-label>
    </ion-range>
</ng-template>

    <!-- INPUT TXT -->
