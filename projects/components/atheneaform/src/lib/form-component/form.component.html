<div class="swiper-buttons-container">
    <swiper #swiper 
    [config]="config" 
    (slideChange)="onSlideChange()" 
    class="swiper-container">
        <ng-container *ngFor="let question of premQuestions; let index = index">
            <ng-template swiperSlide *ngIf="question?.mainTag ? isMainPositive(question?.mainTag) : true">
                <div class="question-container">
                    <ion-grid class="no-padding">
                        <ion-row>
                            <ion-col class="no-padding" size="12">
                                <ion-row>
                                    <ion-col size="1">
                                        <h6>{{question.tag}}.</h6>
                                    </ion-col>
                                    <ion-col size="11" sizeMd="10">
                                        <h3>{{'PREM.'+question.label | translate}}</h3>
                                    </ion-col>
                                </ion-row>
                            </ion-col>
                            <ion-col class="no-padding" offset="1" size="10">
                                <ng-template 
                                    [ngTemplateOutlet]="getType(question.type)" 
                                    [ngTemplateOutletContext]="{index: index}"></ng-template>
                            </ion-col>
                        </ion-row>
                    </ion-grid>
                </div>
            </ng-template>
        </ng-container>
    </swiper>
    <ion-buttons class="nav-buttons">
        <button (click)="slidePrevious()" [disabled]="isBegining">
            <ion-icon name="chevron-up-outline"></ion-icon>
        </button>
        <button (click)="slideNext()" *ngIf="!isEnd; else send">
            <ion-icon name="chevron-down-outline"></ion-icon>
        </button>
        <ng-template #send>
            <button (click)="saveSurvey()">
                Enviar
            </button>
        </ng-template>
    </ion-buttons>
</div>

<ng-template #frequencySelector let-index="index">
    <ion-radio-group mode="md" [ngModel]="premQuestions[index].value" (ngModelChange)="inputChange(index, $event)">
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>Nunca</ion-label>
            <ion-radio slot="start" value="nunca"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>Rara vez</ion-label>
            <ion-radio slot="start" value="rara vez"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>A veces</ion-label>
            <ion-radio slot="start" value="a veces"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>A menudo</ion-label>
            <ion-radio slot="start" value="a menudo"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>Siempre</ion-label>
            <ion-radio slot="start" value="siempre"></ion-radio>
        </ion-item>
    </ion-radio-group>
</ng-template>
<ng-template #numberSelector let-index="index">
    <ion-range min="1" max="10" step="1" [pin]="true" [snaps]="true" [ticks]="false" 
    [(ngModel)]="premQuestions[index].value" (ionKnobMoveEnd)="inputChange(index)">
        <ion-label slot="start">1</ion-label>
        <ion-label slot="end">10</ion-label>
    </ion-range>
</ng-template>
<ng-template #txtSelector let-index="index">
    <!-- INPUT TXT -->
</ng-template>
<ng-template #yesnoSelector let-index="index">
    <ion-radio-group mode="md" [ngModel]="premQuestions[index].value" (ngModelChange)="inputChange(index, $event)">
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>Si</ion-label>
            <ion-radio slot="start" value="si"></ion-radio>
        </ion-item>
        <ion-item lines="none" detail="false" [disabled]="loading">
            <ion-label>No</ion-label>
            <ion-radio slot="start" value="no"></ion-radio>
        </ion-item>
    </ion-radio-group>
</ng-template>
