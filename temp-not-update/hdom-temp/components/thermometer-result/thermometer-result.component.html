<ion-row class="custom_input my-3">
  <ion-input *ngIf="!_manualRegister" type="number" [ngModel]="temp_value | number : '.2-2'" (ngModelChange)="temp_value=$event" (ionChange)="checkValid()"
    [placeholder="0" min="16" max="44"
    [class.danger]="!check?.valid && check?.error != 'invalid_unit'"></ion-input>
    <ion-input #obsInput [hidden]="!_manualRegister" type="number" [(ngModel)]="temp_value" (ionChange)="checkValid()"
    [readonly]="!_manualRegister" placeholder="0" min="16" max="44"
    [class.danger]="!check?.valid && check?.error != 'invalid_unit'"></ion-input>


  <p [class.danger]="!check?.valid && check?.error === 'invalid_unit'">
    {{ hdom?.UNITS?.celsius}}
  </p>
</ion-row>

<div class="alert-box danger" *ngIf="temp_value && !check?.valid">
  <strong>{{'emc.hdom.scan.read_error' | translate}}</strong>
  <p>
    {{(check?.error === 'invalid_unit' ? 'emc.hdom.scan.temperatureObservation.invalid_unit_error' : 'emc.hdom.scan.temperatureObservation.invalid_value_error') | translate}}
  </p>
</div>
