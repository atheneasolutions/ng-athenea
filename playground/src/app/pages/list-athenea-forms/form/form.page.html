<app-header [hospital]="userService.lastPatientHospital!">
</app-header>
<ion-content class="ion-padding" [scrollY]="false">
  <div class="form-wrapper u-wrapper u-wrapper-content">
    <app-breadcrumbs [breadcrumbs]="[{locale: 'list_forms.list', route: '/list-athenea-forms/' + enviamentId}, {locale: title}]"></app-breadcrumbs> 
    <div class="max-form">
        <atheneaform
          [id]="id"
          [questions]="questions"
          [title]="title"
          [lang]="lang"                 
          (sendSurvey)="send()"
          [preview]="preview"
          [canAnswer]="canAnswer"
          [availableDate]="availableDate"
          [answersId]="answersId"
          [useLocalStorage]="useLocalStorage"
          [useSaveProgress]="useSaveProgress"
          [useBackgroundImage]="useBackgroundImage">
        </atheneaform>
      </div>
  </div>
</ion-content>
